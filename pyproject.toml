[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portprimer"
version = "1.0.0"
description = "A visual port scanner that teaches beginners what open services mean."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PortPrimer Maintainers" }]
license = { file = "LICENSE" }
keywords = ["cybersecurity", "education", "ports", "tcp", "rich"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Security",
]
dependencies = ["rich>=13.7.0", "pytest>=8.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
portprimer = "portprimer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["portprimer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
